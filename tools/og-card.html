<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source of images/og-card.png: open at 1200x630 and screenshot (see tools/README.md) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f7f4ee; color: #1c1b18; font-family: "IBM Plex Sans", sans-serif; display: grid; grid-template-columns: 1fr 360px; }
  .copy { padding: 72px 0 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-family: "DM Mono", monospace; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: #5d5a52; }
  h1 { margin: 24px 0 0; font-family: "Fraunces", serif; font-weight: 500; font-size: 78px; line-height: 1.02; letter-spacing: -.02em; }
  p { margin: 22px 0 0; font-size: 26px; line-height: 1.4; max-width: 640px; }
  .url { font-family: "DM Mono", monospace; font-size: 20px; color: #0f6b45; }
  .photo { padding: 72px 80px 72px 0; display: flex; align-items: center; }
  .photo img { width: 100%; border: 1px solid #d8d2c4; padding: 6px; background: #fff; box-sizing: border-box; }
</style></head>
<body>
  <div class="copy">
    <div>
      <div class="eyebrow">Data analyst · Perth, Western Australia</div>
      <h1>Waranyu<br>Bancherdvanich</h1>
      <p>Dashboards and forecasts in Power BI, SQL, Python and R. Four projects that run on their real data.</p>
    </div>
    <div class="url">waranyu-cv.vercel.app</div>
  </div>
  <div class="photo"><img src="../images/portrait.webp" alt=""></div>
</body></html>
